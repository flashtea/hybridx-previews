<!-- The browser-tab mark: the two channels.

     A solid bar beside an outlined one — kilograms beside kilometres, the same
     pair the app draws on every day of the year
     (shared/components/channel-bars). "Two disciplines, one body" as a shape.

     Why this and not the HYBRID+X lockup it replaces: a wordmark at 16px is a
     smudge, and the previous ownable mark (`hybrid-strands`) was retired in the
     2026-08 migration for shipping its own legend, which DESIGN.md rule 5
     forbids. The channel pair needs no legend and no colour key — the two
     channels differ by FILL vs OUTLINE, a difference of kind, which is the one
     kind of difference that survives being four pixels wide. Opacity, hue and
     size all die at this scale; a hole does not.

     No amber. Rule 2 gives a surface one amber and it has to mean NOW; an app
     icon has no now. Painting one channel amber would also encode a discipline
     in hue, which is precisely the dialect fill-vs-outline exists to avoid.

     GEOMETRY IS ON A 4-UNIT GRID, ON PURPOSE. Every x, y, width and height
     below is a multiple of 4, so at 16px (64 ÷ 4) every edge lands on a whole
     device pixel: the solid bar is 4px wide, the outlined bar is 4px wide with
     1px walls around a 2×8px hole. Nothing antialiases, so the hole stays a
     hole. Do not nudge a value off the grid to "balance" it — verify at 16px
     first. It also lands clean at 32px and 48px (÷2, ÷1.33 of 12).

     THERE IS NO BASELINE UNDER THE BARS, and adding one back is a regression.
     The strip the mark is quoted from (shared/components/channel-bars) draws a
     baseline because seven days of DIFFERING bar heights need one datum to be
     read against; that is the line's whole job. The two bars here are the same
     height and stand on the same edge, so the line would have nothing to
     establish. It is also unbuildable: a baseline is a hairline, defined in
     device pixels, and this file is rasterised from 16px to 512px — a 32×
     range in which one geometry cannot stay a hairline. The version this
     replaces proved it, rendering as nothing at 32px and as a grey shelf,
     visibly misregistered against the bars, at 192px and above.

     This file is the rounded source: it ships as the SVG favicon and is
     rasterised to favicon.png and the multi-size favicon.ico, none of which is
     ever masked. The full-bleed square the PWA icon family comes from is
     assets/icons/icon.svg — same mark, framed for Android's maskable safe
     zone. Both are regenerated by scripts/generate-icons.sh.

     Palette: DESIGN.md §Palette. -->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#141417"/>

  <!-- Solid = kilograms. -->
  <rect x="12" y="12" width="16" height="40" fill="#ded9cc"/>

  <!-- Outlined = kilometres. One path with an evenodd hole rather than a
       stroked rect, so the wall is exactly 4 units on every side and does not
       depend on stroke alignment — and so the mark stays transparent inside,
       working on any ground rather than only over this tile. -->
  <path fill="#ded9cc" fill-rule="evenodd"
        d="M36 12h16v40H36Z M40 16h8v32h-8Z"/>
</svg>
