<!-- The source every icon-*.png in this folder is rendered from.
     Run scripts/generate-icons.sh after editing it.

     Same mark as src/favicon.svg — the two channels, solid kilograms beside
     outlined kilometres (DESIGN.md rule 5; the reasoning is written out there).
     This file differs only in framing:

     Full-bleed, square, no corner radius on purpose: sizes 72 and up are
     declared `purpose: "maskable any"` in manifest.webmanifest and Android
     applies its own mask. A rounded source would show transparent corners
     inside that mask, and iOS (which never masks a transparent icon, it just
     squircles it) is happy with a full square too.

     THE BARS ARE SHORTER HERE THAN IN favicon.svg, and that is the only reason
     two sources exist. Maskable content must sit inside the centred circle of
     diameter 80% — radius 25.6 at 64 units. The pair below spans 40×32 centred
     on (32,32), so a bar corner is sqrt(20² + 16²) = 25.61 from the centre: on
     the safe circle to within a hundredth of a unit, which is a tenth of a
     pixel at 512. favicon.svg's 40-tall bars would put a corner at 28.3 and
     lose their tops to a circular mask. If you heighten or widen anything here,
     redo that arithmetic.

     Bar WIDTH is unchanged from favicon.svg (16, with 4-unit walls), so the
     outline reads at exactly the same weight relative to the bar; only the
     height gives way to the safe zone.

     Every value below is a multiple of 4, with no exceptions — nothing here is
     allowed off the grid. That buys whole-pixel edges at every rendered size
     whose 4-unit step is a whole number of pixels: 32, 48, 64, 96, 128, 144,
     192, 256, 384 and 512 all render in exactly two colours, ink and ground.
     72 and 152 cannot, and never will: their steps are 4.50px and 9.50px, so
     each vertical bar edge is one column of 50% grey. That is antialiasing
     doing its job on a half-covered pixel, one column wide, and it is the only
     impurity left in the family — worth knowing so it is not mistaken for the
     shelf this file used to draw.

     NO FLOOR HERE, and do not add one back: see favicon.svg for why. It is
     doubly wrong in this file, because a floor wide enough to sit under both
     bars leaves the maskable safe circle and has to be pulled off the grid to
     get back inside it. That compromise is what put a misregistered shelf under
     the mark at 192px and up. -->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="#141417"/>

  <!-- Solid = kilograms. -->
  <rect x="12" y="16" width="16" height="32" fill="#ded9cc"/>

  <!-- Outlined = kilometres. Evenodd hole, not a stroke — see favicon.svg. -->
  <path fill="#ded9cc" fill-rule="evenodd"
        d="M36 16h16v32H36Z M40 20h8v24h-8Z"/>
</svg>
