    /*
     * Boot splash: rendered as projected content inside <app-root> below.
     * Angular replaces all children of <app-root> when it bootstraps, so the
     * splash disappears the instant the first view renders. Lives in <head>
     * so it paints before the bundled stylesheet loads — important on iOS
     * PWA resumes where the recovery service triggers a hard reload.
     * Only shown in installed PWA mode (display-mode: standalone) — the surface
     * where an iOS-recovery reload or cold relaunch otherwise shows a bare dark
     * "blank grey page". Scoped to standalone on purpose: the same index.html
     * also serves the public marketing pages, so a broader match would flash
     * this splash over the landing page for every first-time mobile visitor.
     * On desktop/browser the dark body background covers the brief boot window.
     */
    .boot-splash {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #141417;
      z-index: 2147483647;
    }
    @media (display-mode: standalone) {
      .boot-splash { display: flex; }
    }
    .boot-splash__logo {
      width: 96px;
      height: 96px;
      border-radius: 22%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .boot-splash__spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.85);
      /* Logo paints instantly; the spinner fades in only if the boot is still
         going after 400ms, so a fast resume shows a clean logo, not a flicker. */
      opacity: 0;
      animation: boot-splash-spin 0.9s linear infinite,
                 boot-splash-fade 0.2s ease-out 0.4s forwards;
    }
    @keyframes boot-splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes boot-splash-fade {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-splash__spinner { animation-duration: 2.4s; }
    }
  </style>

  <style>
    /*
     * Pre-boot landing shell (#hx-shell, bottom of <body>): a static copy of
     * the landing's first screen that paints from this HTML alone — no JS — so
     * a cold mobile visitor sees the page in <1s instead of a dark screen for
     * the 4-6s the SPA needs to boot (measured on the first Reddit ad cohort,
     * 2026-07-11). Gated by the inline script below to logged-out browser
     * visits on "/" (html.hx-shell). It sits as a fixed overlay OUTSIDE
     * <app-root> because the landing route is lazy: app-root's children are
     * discarded at bootstrap, seconds before the real hero renders. The
     * landing component crossfades it away after its first paint
     * (html.hx-shell-done); AppComponent drops it if the router resolves
     * elsewhere. Hero strings are single-sourced in
     * app/landing/hero-copy.json — generate-static-snapshots.mjs fails the
     * build if this markup drifts from it.
     */
    #hx-shell { display: none; }
    /* Pre-boot the document is viewport-high (no scrollbar); the booted
       landing always scrolls. Forcing the scrollbar from the start keeps the
       layout width — and every centered element — identical across the swap
       on classic-scrollbar platforms. The class persists after boot, so the
       geometry never changes back. */
    html.hx-shell { overflow-y: scroll; }
    /* Only while the shell is up: the class outlives it, and the app's own
       ground is #141417. After the handover the landing sets html.lp-page. */
    html.hx-shell:not(.hx-shell-done),
    html.hx-shell:not(.hx-shell-done) body { background: #131209; }
    html.hx-shell #hx-shell {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 2147483646; /* below the standalone-only boot splash */
      overflow: hidden;
      /* --lp-bg (:root in styles.scss). Literal because this block paints
         before the bundled stylesheet exists. */
      background: #131209;
      transition: opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    html.hx-shell-done #hx-shell { opacity: 0; pointer-events: none; }
    /* The crawler snapshot (generate-static-snapshots.mjs) sits in <app-root>
       under the shell until Angular discards it. Invisible to the visitor, but
       not to Core Web Vitals: its paragraphs re-wrapped when the web font
       landed, and that reflow scored as layout shift (0.14–0.18) on every cold
       visit. Hidden while the shell is up; a crawler without JS never gets the
       hx-shell class, so it still reads every word. */
    html.hx-shell #hx-landing-snapshot { visibility: hidden; }
    /* ── The first screen, mirrored ─────────────────────────────────────────
       Everything below restates the nav and the hero of landing.component.scss
       and lp-week.component.scss (and the steps of _landing-system.scss) for
       the shell: the week's seven columns and their days, the words, and the
       example week standing in the columns. The shell is not inside the
       landing component, so Angular's scoping attribute never reaches it:
       without this the shell paints unstyled markup and the crossfade drops a
       different page on the visitor a second later — which is the one thing
       this shell exists to prevent.

       Change them there, change them here (landing-shell-parity.cy.ts compares
       the two line by line). Colours, spaces and sizes are literal because
       this block paints before the bundled stylesheet loads; they are the
       --lp-* tokens in src/styles.scss and must be kept equal to them.

       The first screen ARRIVES here, and only here on a cold visit: the lines
       are drawn down, the words come in, the sessions drop into their days.
       The page under the shell is already at rest and does not arrive a second
       time; it waits for this arrival to finish before it fades the shell
       (LandingComponent, dismissLandingShell). The timings are the page's own
       (`.intro`), which a visit without a shell plays instead. */
    #hx-shell {
      color: #ece8de;
      font-family: "Geist", system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.5rem;
      font-weight: 400;

    #hx-shell h1 { font-family: inherit; text-wrap: balance; }

  <script>
    // Landing-shell gate — synchronous so the decision lands before first
    // paint. Marketing shell only for logged-out browser visits to "/":
    // installed-PWA launches get the boot splash instead, and a stored
    // access token means "/" immediately redirects to the app.
